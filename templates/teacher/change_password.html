<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password - PreQABoard</title>

</head>

<body>

    <h1>PreQABoard</h1>

    <h2>Change Password</h2>

    <hr>


    <p>

        <a href="{{ url_for('teacher.profile') }}">
            ← Back to Profile
        </a>

    </p>


    {% if error %}

    <p style="color: red;">
        {{ error }}
    </p>

    {% endif %}


    {% if success %}

    <p style="color: green;">
        {{ success }}
    </p>

    {% endif %}


    <h3>Update Password</h3>


    <form method="POST"
          action="{{ url_for('teacher.change_password') }}">


        <label>
            Current Password:
        </label>

        <br>

        <input
            type="password"
            name="current_password"
            required
        >


        <br><br>


        <label>
            New Password:
        </label>

        <br>

        <input
            type="password"
            name="new_password"
            required
        >


        <br><br>


        <label>
            Confirm New Password:
        </label>

        <br>

        <input
            type="password"
            name="confirm_password"
            required
        >


        <br><br>


        <button type="submit">
            Change Password
        </button>

    </form>


    <br>

    <hr>


    <p>

        <a href="{{ url_for('teacher.dashboard') }}">
            Back to Dashboard
        </a>

    </p>


    <p>

        <a href="{{ url_for('teacher.logout') }}">
            Logout
        </a>

    </p>


</body>

</html>
