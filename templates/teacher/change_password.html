<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Change Password • Teacher • PreQABoard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/teacher/teacher_change_password.css') }}">
</head>
<body>
  <div class="ns-wrap">
    <div class="container">
      <header class="topbar">
        <div class="page-title">
          <h1>Change Password</h1>
          <p>Update your password securely.</p>
        </div>
        <div class="actions">
          <a class="btn" href="{{ url_for('teacher.dashboard') }}">Back to Dashboard</a>
        </div>
      </header>

      <div class="alerts">
        {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
        {% if success %}<div class="alert success">{{ success }}</div>{% endif %}
      </div>

      <section class="ns-card">
        <div class="ns-head">
          <h1>Password Update</h1>
          <p>Use a strong password and don’t reuse old passwords.</p>
        </div>
        <div class="ns-body">
          <form class="form" method="POST" action="">
            <div class="field">
              <label for="current_password">Current Password</label>
              <input id="current_password" name="current_password" type="password" required>
            </div>

            <div class="form-row">
              <div class="field">
                <label for="new_password">New Password</label>
                <input id="new_password" name="new_password" type="password" required>
              </div>
              <div class="field">
                <label for="confirm_password">Confirm New Password</label>
                <input id="confirm_password" name="confirm_password" type="password" required>
              </div>
            </div>

            <div class="actions">
              <button class="btn btn-primary" type="submit">Update Password</button>
              <a class="btn" href="{{ url_for('teacher.profile') }}">Cancel</a>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
