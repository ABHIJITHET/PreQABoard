<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus - PreQABoard</title>
</head>
<body>

    <h2>Syllabus</h2>

    <p>
        <a href="{{ url_for('student.dashboard') }}">← Dashboard</a> |
        <a href="{{ url_for('student.logout') }}">Logout</a>
    </p>

    <hr>

    {% if syllabi %}
        <table border="1" cellpadding="8" cellspacing="0">
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Title</th>
                    <th>Academic Year</th>
                    <th>Uploaded At</th>
                    <th>Download</th>
                </tr>
            </thead>
            <tbody>
                {% for s in syllabi %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ s.title }}</td>
                    <td>{{ s.academic_year_name }}</td>
                    <td>{{ s.uploaded_at }}</td>
                    <td>
                        <a href="{{ url_for('student.download_syllabus', syllabus_id=s.syllabus_id) }}">
                            Download
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p><strong>No syllabus uploaded yet.</strong></p>
    {% endif %}

</body>
</html>
