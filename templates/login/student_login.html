<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login - PreQABoard</title>

</head>

<body>

    <h1>Student Login</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <p>{{ message }}</p>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST"
          action="{{ url_for('student.login') }}">

        <label>Username:</label>

        <br>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>


        <label>Password:</label>

        <br>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>


        <button type="submit">
            Login
        </button>

    </form>


    <br>


    <p>
        Don't have an account?

        <a href="{{ url_for('student.register') }}">
            Register as Student
        </a>
    </p>


    <p>
        <a href="/">
            Back to Home
        </a>
    </p>

</body>

</html>
