<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password - PreQABoard</title>

</head>

<body>

    <h1>PreQABoard</h1>

    <h2>Change Password</h2>

    <hr>


    <!-- =====================================================
         BACK TO PROFILE
    ====================================================== -->

    <p>
        <a href="{{ url_for('hod.profile') }}">
            ← Back to Profile
        </a>
    </p>


    <!-- =====================================================
         ERROR MESSAGE
    ====================================================== -->

    {% if error %}

    <p style="color: red;">
        {{ error }}
    </p>

    {% endif %}


    <!-- =====================================================
         SUCCESS MESSAGE
    ====================================================== -->

    {% if success %}

    <p style="color: green;">
        {{ success }}
    </p>

    {% endif %}


    <!-- =====================================================
         CHANGE PASSWORD FORM
    ====================================================== -->

    <h3>Update Password</h3>

    <form method="POST"
          action="{{ url_for('hod.change_password') }}">

        <!-- CURRENT PASSWORD -->

        <label for="current_password">
            Current Password:
        </label>

        <br>

        <input
            type="password"
            id="current_password"
            name="current_password"
            required
        >

        <br><br>


        <!-- NEW PASSWORD -->

        <label for="new_password">
            New Password:
        </label>

        <br>

        <input
            type="password"
            id="new_password"
            name="new_password"
            required
            minlength="6"
        >

        <br><br>


        <!-- CONFIRM PASSWORD -->

        <label for="confirm_password">
            Confirm New Password:
        </label>

        <br>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
            minlength="6"
        >

        <br><br>


        <!-- SHOW PASSWORD -->

        <input
            type="checkbox"
            id="show_password"
            onclick="showPasswords()"
        >

        <label for="show_password">
            Show Password
        </label>

        <br><br>


        <!-- SUBMIT -->

        <button type="submit">
            Change Password
        </button>

    </form>


    <br>

    <hr>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <p>
        <a href="{{ url_for('hod.dashboard') }}">
            Back to Dashboard
        </a>
    </p>

    <p>
        <a href="{{ url_for('hod.logout') }}">
            Logout
        </a>
    </p>


    <!-- =====================================================
         SHOW / HIDE PASSWORD SCRIPT
    ====================================================== -->

    <script>

        function showPasswords() {

            const currentPassword =
                document.getElementById("current_password");

            const newPassword =
                document.getElementById("new_password");

            const confirmPassword =
                document.getElementById("confirm_password");

            const type =
                currentPassword.type === "password"
                    ? "text"
                    : "password";

            currentPassword.type = type;
            newPassword.type = type;
            confirmPassword.type = type;
        }

    </script>

</body>

</html>
