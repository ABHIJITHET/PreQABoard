<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit HOD - PreQABoard</title>

</head>

<body>

    <h1>PreQABoard - Edit HOD</h1>

    <h2>Edit HOD Account</h2>

    <hr>

    <form method="POST">

        <!-- Department -->

        <label>Department:</label>
        <br>

        <select name="department_id" required>

            {% for department in departments %}

                <option
                    value="{{ department.department_id }}"
                    {% if department.department_id == hod.department_id %}
                        selected
                    {% endif %}
                >
                    {{ department.department_name }}
                </option>

            {% endfor %}

        </select>

        <br><br>


        <!-- Employee ID -->

        <label>Employee ID:</label>
        <br>

        <input
            type="text"
            name="employee_id"
            value="{{ hod.employee_id }}"
            required
        >

        <br><br>


        <!-- Full Name -->

        <label>Full Name:</label>
        <br>

        <input
            type="text"
            name="full_name"
            value="{{ hod.full_name }}"
            required
        >

        <br><br>


        <!-- Email -->

        <label>Email:</label>
        <br>

        <input
            type="email"
            name="email"
            value="{{ hod.email }}"
            required
        >

        <br><br>


        <!-- Phone -->

        <label>Phone:</label>
        <br>

        <input
            type="text"
            name="phone"
            value="{{ hod.phone or '' }}"
        >

        <br><br>


        <!-- Username -->

        <label>Username:</label>
        <br>

        <input
            type="text"
            name="username"
            value="{{ hod.username }}"
            required
        >

        <br><br>


        <!-- Password -->

        <label>New Password:</label>
        <br>

        <input
            type="password"
            name="password"
            placeholder="Leave blank to keep current password"
        >

        <br>

        <small>
            Leave this field empty if you do not want to change the password.
        </small>

        <br><br>


        <!-- Account Status -->

        <label>Account Status:</label>
        <br>

        <select name="account_status" required>

            <option
                value="Pending"
                {% if hod.account_status == 'Pending' %}
                    selected
                {% endif %}
            >
                Pending
            </option>

            <option
                value="Active"
                {% if hod.account_status == 'Active' %}
                    selected
                {% endif %}
            >
                Active
            </option>

            <option
                value="Inactive"
                {% if hod.account_status == 'Inactive' %}
                    selected
                {% endif %}
            >
                Inactive
            </option>

        </select>

        <br><br>


        <button type="submit">
            Update HOD
        </button>

    </form>

    <br>

    <a href="{{ url_for('admin.hod_accounts') }}">
        Back to HOD Accounts
    </a>

    <br><br>

    <a href="{{ url_for('admin.dashboard') }}">
        Back to Dashboard
    </a>

</body>

</html>
