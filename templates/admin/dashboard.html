<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - PreQABoard</title>

</head>
<body>

    <!-- =====================================================
         ADMIN DASHBOARD HEADER
         ===================================================== -->

    <h1>PreQABoard Admin Dashboard</h1>

    <h2>

    </h2>
    <hr>


    <!-- =====================================================
         ADMIN FUNCTIONS
         ===================================================== -->

    <h3>Admin Functions</h3>

    <ul>

        <!-- Department Management -->
        <li>
            <a href="{{ url_for('admin.departments') }}">

            </a>

        <li>
            <a href="{{ url_for('admin.courses') }}">

            </a>
        </li>

        <!-- Academic Year Management -->
        <li>
            <a href="#">

            </a>
        </li>

        <!-- Exam Type Management -->
        <li>
            <a href="#">

            </a>
        </li>

        <!-- HOD Management -->
        <li>
            <a href="#">

            </a>
        </li>

    <!-- =====================================================

    <a href="{{ url_for('admin.logout') }}">
